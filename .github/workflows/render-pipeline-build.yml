name: Render pipeline build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/render-pipeline]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript and frontend
        run: npm run build

  tauri-rust-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check native Tauri commands
        run: cargo check --manifest-path src-tauri/Cargo.toml
